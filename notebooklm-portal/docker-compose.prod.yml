services:
  redis:
    image: redis:7-alpine
    container_name: notebooklm-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: notebooklm-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://notebooklm:notebooklm_secret@host.docker.internal:5432/notebooklm_portal
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-to-random-64-chars}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-210253279227-dnc5o6e24scv1g98ink6mft31l7q7cqt.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET}}
      - GOOGLE_REDIRECT_URI=https://novaai.8.jugaar.ai/auth/callback
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-${OPENROUTER_API_KEY}}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - LLM_DEFAULT_PROVIDER=openrouter
      - LLM_DEFAULT_MODEL=qwen/qwen3.7-max
      - LLM_MAX_RETRIES=3
      - LLM_TIMEOUT_SECONDS=60
      - CORS_ORIGINS=https://novaai.8.jugaar.ai,http://localhost:80
      - NOTEBOOKLM_STORAGE_BASE=/app/storage
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - RATE_LIMIT_FREE=50
      - RATE_LIMIT_PRO=200
      - RATE_LIMIT_ADMIN=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notebooklm-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: notebooklm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  redis_data:
  storage_data:
