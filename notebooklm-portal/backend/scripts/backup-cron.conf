# Crontab for NotebookLM Portal automated backups
# Install: crontab -e  (then paste below)
# Or place in /etc/cron.d/notebooklm

# Daily backup at 2:00 AM
0 2 * * * cd /app && bash scripts/backup.sh >> /var/log/notebooklm-backup.log 2>&1

# Weekly full backup on Sundays at 3:00 AM (kept 30 days)
0 3 * * 0 BACKUP_DIR=/backups/postgres/weekly RETENTION_DAYS=30 cd /app && bash scripts/backup.sh >> /var/log/notebooklm-backup.log 2>&1
